<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord</title>
<style>
 /* === VARIABLES ET THÈMES === */
:root {
    --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #fff;
    --title-color: #4da6ff; --border-color: #333; --th-bg: #2a2a2a;
    --stat-bg: #252525; --font-family: sans-serif; --box-shadow: none;
    --text-shadow: none; --input-bg: #2a2a2a; --button-bg: #333;
}

body.pipboy {
    --bg-color: #020d04; --card-bg: #051a08; --text-color: #1ff042;
    --title-color: #1ff042; --border-color: #1ff042; --th-bg: #0a2e0e;
    --stat-bg: #0c3811; --font-family: 'Courier New', monospace;
    --box-shadow: 0 0 10px #1ff04233; --text-shadow: 0 0 5px #1ff042b3;
    --input-bg: #051a08; --button-bg: #0a2e0e;
}

/* Effet CRT Pip-Boy */
body.pipboy::before {
    content: ""; position: fixed; inset: 0; z-index: 100; pointer-events: none;
    background: linear-gradient(#12101000 50%, #00000040 50%), linear-gradient(90deg, #ff000008, #00ff0003, #0000ff08);
    background-size: 100% 3px, 6px 100%;
}

/* === STRUCTURE BASE === */
body { 
    font-family: var(--font-family); background-color: var(--bg-color); 
    color: var(--text-color); padding: 8px; text-shadow: var(--text-shadow);
    transition: all 0.3s ease; overflow-x: hidden;
}

.card { 
    background-color: var(--card-bg); padding: 10px; border-radius: 6px; 
    margin-bottom: 10px; border: 1px solid var(--border-color); box-shadow: var(--box-shadow);
}

h2 { margin: 0 0 6px 0; color: var(--title-color); font-size: 1.1rem; text-shadow: var(--text-shadow); }
.data { font-size: 1.3rem; font-weight: bold; }
ul { padding-left: 16px; margin: 0; }
li { font-size: 0.95rem; margin-bottom: 3px; }

/* === BOUTON SWITCH === */
.toggle-container {
    position: fixed; top: 8px; right: 8px; display: flex; align-items: center;
    gap: 6px; background: var(--card-bg); border: 1px solid var(--border-color);
    padding: 4px 8px; border-radius: 16px; z-index: 101; box-shadow: var(--box-shadow);
}
.toggle-label { font-size: 0.75rem; font-weight: bold; color: var(--text-color); }
.language-toggle { top: 42px; }
.language-toggle .toggle-label { min-width: 22px; text-align: center; }
.switch { position: relative; display: inline-block; width: 34px; height: 18px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; inset: 0; background-color: #555; transition: .4s; border-radius: 18px; }
.slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: #fff; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: #1ff042; }
input:checked + .slider:before { transform: translateX(16px); background-color: #020d04; }

/* === ENTÊTE VILLE & GPS === */
.city-header { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.city-input, .btn-gps {
    background-color: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color);
    padding: 4px 6px; border-radius: 4px; font-family: var(--font-family); font-size: 0.9rem;
}
.city-input { outline: none; flex: 1; min-width: 120px; }
.btn-gps { background-color: var(--button-bg); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: filter 0.2s; }
.btn-gps:hover { filter: brightness(1.3); }

.weather-display { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.city-time { font-size: 0.95rem; color: var(--title-color); font-weight: normal; }

/* === PRÉVISIONS MÉTÉO === */
.forecast-container { display: flex; overflow-x: auto; gap: 6px; margin-top: 8px; padding-bottom: 4px; }
.forecast-item { flex: 0 0 auto; background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 6px; text-align: center; min-width: 55px; }
.forecast-time { font-size: 0.7rem; color: #888; }
body.pipboy .forecast-time { color: var(--text-color); }
.forecast-temp { font-size: 0.85rem; font-weight: bold; margin: 2px 0; }
.forecast-pop { font-size: 0.65rem; color: var(--title-color); }

/* === TABLEAU BASEBALL === */
.linescore-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; margin: 6px 0 8px 0; text-align: center; }
.linescore-table th, .linescore-table td { border: 1px solid var(--border-color); padding: 4px 2px; position: relative; }
.linescore-table th { background-color: var(--th-bg); color: var(--text-color); font-weight: normal; }
.linescore-table td.team-name { text-align: left; padding-left: 4px; font-weight: bold; color: var(--text-color); max-width: 70px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linescore-table .stat-col { background-color: var(--stat-bg); font-weight: bold; color: var(--title-color); }

/* Tooltips */
.linescore-table td.has-details:hover, .linescore-table td.stat-col:hover { filter: brightness(1.3); cursor: pointer; }
.linescore-table td .tooltip {
    visibility: hidden; min-width: 180px; max-width: 260px; width: max-content;
    background-color: var(--card-bg); color: var(--text-color); text-align: left;
    border-radius: 4px; padding: 6px; position: absolute; z-index: 10; bottom: 115%;
    left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.2s;
    box-shadow: var(--box-shadow); border: 1px solid var(--border-color);
    font-size: 0.7rem; pointer-events: none; white-space: normal; word-break: break-word; font-weight: normal;
}
.linescore-table td:first-child .tooltip { left: 0; transform: none; }
.linescore-table td:nth-last-child(-n+3) .tooltip { left: auto; right: 0; transform: none; }
.linescore-table td:hover .tooltip { visibility: visible; opacity: 1; }

/* === NAVIGATION JEUX === */
.btn-pagination {
    background-color: var(--button-bg); color: var(--text-color); border: 1px solid var(--border-color);
    padding: 4px 10px; border-radius: 4px; font-family: var(--font-family); font-size: 0.85rem;
    cursor: pointer; transition: filter 0.2s;
}
.btn-pagination:hover:not(:disabled) { filter: brightness(1.3); }
.btn-pagination:disabled { opacity: 0.5; cursor: not-allowed; }
.pagination-container { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 10px; }
</style>
</head>
<body>

    <div class="card">

<div class="card">
    <h2 data-i18n="gameReleases">🎮 Sorties jeux vidéo</h2>
    <div style="margin-bottom: 12px;">
        <label for="inputMois" style="font-size: 0.9rem;" data-i18n="chooseMonth">Choisir le mois : </label>
        <input type="month" id="inputMois" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc;">
    </div>
    <div id="divMonthlyGames">Chargement des sorties...</div>
</div>

    <script>
        const vTraductions = {
            fr: {
                pageTitle: "Tableau de Bord", localTime: "🕒 Heure locale", weather: "🌤️ Météo :", mlb: "⚾ MLB:", gameReleases: "🎮 Sorties jeux vidéo",
                chooseMonth: "Choisir le mois :", gpsTitle: "Utiliser ma position GPS", loading: "Chargement...",
                locating: "Localisation...", myPosition: "Ma position", gpsError: "Erreur GPS",
                gpsUnavailable: "La géolocalisation n'est pas supportée par votre navigateur.",
                gpsFailed: "Impossible d'obtenir la position GPS.", cityNotFound: "Ville non trouvée",
                searchError: "Erreur de recherche", connectionError: "Erreur de connexion", noHits: "Aucun coup sûr ni point",
                hits: "Coups sûrs", runsBattedIn: "Points produits", errors: "Erreurs", noErrors: "Aucune erreur",
                noData: "Aucune donnée", live: "EN DIRECT", inning: "Manche", lastGame: "Dernier match :",
                nextGame: "Prochain match :", lastUpdate: "Dernière MàJ :", noGame: "Aucun match trouvé.",
                noRecentGames: "Aucun match au calendrier récent.", mlbError: "Erreur de chargement des données MLB",
                missingApiKey: "Clé API manquante.", loadingReleases: "Chargement des sorties...",
                noReleases: "Aucune sortie majeure trouvée pour ce mois.", release: "Sortie :",
                unknownDate: "Date inconnue", collectiveError: "Erreur collective", releasesError: "Impossible de charger les sorties",
                prevPage: "Précédent", nextPage: "Suivant",
                today: "Aujourd'hui", tomorrow: "Demain", feelsLike: "Ressenti"
            },
            en: {
                pageTitle: "Dashboard", localTime: "🕒 Local time", weather: "🌤️ Weather:", mlb: "⚾ MLB:", gameReleases: "🎮 Video game releases",
                chooseMonth: "Choose month: ", gpsTitle: "Use my GPS location", loading: "Loading...",
                locating: "Locating...", myPosition: "My location", gpsError: "GPS error",
                gpsUnavailable: "Geolocation is not supported by your browser.",
                gpsFailed: "Unable to get your GPS location.", cityNotFound: "City not found",
                searchError: "Search error", connectionError: "Connection error", noHits: "No hits or runs",
                hits: "Hits", runsBattedIn: "Runs batted in", errors: "Errors", noErrors: "No errors",
                noData: "No data", live: "LIVE", inning: "Inning", lastGame: "Last game:",
                nextGame: "Next game:", lastUpdate: "Last update:", noGame: "No game found.",
                noRecentGames: "No recent game on the schedule.", mlbError: "Error loading MLB data",
                missingApiKey: "Missing API key.", loadingReleases: "Loading releases...",
                noReleases: "No major releases found for this month.", release: "Release:",
                unknownDate: "Unknown date", collectiveError: "Team error", releasesError: "Unable to load releases",
                prevPage: "Previous", nextPage: "Next",
                today: "Today", tomorrow: "Tomorrow", feelsLike: "Feels like"
            }
        };
        let vLangue = localStorage.getItem('language') || 'fr';
        const t = pCle => vTraductions[vLangue][pCle] || pCle;
        const vLocale = () => vLangue === 'en' ? 'en-CA' : 'fr-CA';

        function appliquerTraductions() {
            document.documentElement.lang = vLangue === 'en' ? 'en' : 'fr-CA';
            document.title = t('pageTitle');
            document.querySelectorAll('[data-i18n]').forEach(pElement => pElement.textContent = t(pElement.dataset.i18n));
            document.querySelectorAll('[data-i18n-title]').forEach(pElement => pElement.title = t(pElement.dataset.i18nTitle));
            document.getElementById('chkLangue').checked = vLangue === 'en';
            document.getElementById('divHeure').innerText = t('loading');
            document.getElementById('divMeteo').innerText = t('loading');
            document.getElementById('divJays').innerText = t('loading');
            document.getElementById('divMonthlyGames').innerText = t('loadingReleases');
        }

        function toggleLanguage(pIsEnglish) {
            vLangue = pIsEnglish ? 'en' : 'fr';
            localStorage.setItem('language', vLangue);
            appliquerTraductions();
            updateHeures();
            rechercherVille(document.getElementById('txtVille').value);
            fetchBlueJays(document.getElementById('selEquipeMlb').value);
            const vMois = document.getElementById('inputMois').value;
            if (vMois) {
                const [vAnnee, vMoisChoisi] = vMois.split('-');
                chargerSortiesMoisAuto(vApiKey, vAnnee, vMoisChoisi, vPageJeux);
            }
        }

        appliquerTraductions();

        // Variables globales pour le fuseau horaire de la ville
        let vTimezoneVille = "America/Toronto";

        // --- GESTION DU THÈME (PIP-BOY / DÉFAUT) ---
        function toggleTheme(pIsPipboy) {
            if (pIsPipboy) {
                document.body.classList.add('pipboy');
                localStorage.setItem('theme', 'pipboy');
            } else {
                document.body.classList.remove('pipboy');
                localStorage.setItem('theme', 'default');
            }
        }

        // Chargement du thème sauvegardé
        const vThemeSauvegarde = localStorage.getItem('theme');
        if (vThemeSauvegarde === 'pipboy') {
            document.getElementById('chkPipboy').checked = true;
            toggleTheme(true);
        }

        // 1. Horloge globale + Horloge de la ville
        function updateHeures() {
            const vDate = new Date();
            document.getElementById('divHeure').innerText = vDate.toLocaleTimeString(vLocale());

            if (vTimezoneVille) {
                try {
                    const vHeureVilleStr = vDate.toLocaleTimeString(vLocale(), { timeZone: vTimezoneVille, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    document.getElementById('divHeureVille').innerText = `🕒 ${vHeureVilleStr}`;
                } catch (e) {
                    document.getElementById('divHeureVille').innerText = "";
                }
            }
        }
        setInterval(updateHeures, 1000);
        updateHeures();

        // Helper pour convertir le code météo WMO en symbole
        function getIconeMeteo(pCode) {
            if (pCode === 0) return "☀️";
            if (pCode >= 1 && pCode <= 3) return "⛅";
            if (pCode >= 45 && pCode <= 48) return "🌫️";
            if (pCode >= 51 && pCode <= 67) return "🌧️";
            if (pCode >= 71 && pCode <= 77) return "❄️";
            if (pCode >= 80 && pCode <= 82) return "🌦️";
            if (pCode >= 95) return "🌩️";
            return "🌡️";
        }

        // 2. Géocodage, Géolocalisation GPS et Météo
        function obtenirGeolocalisation() {
            if (navigator.geolocation) {
                document.getElementById('divMeteo').innerText = t('locating');
                navigator.geolocation.getCurrentPosition(async (pPosition) => {
                    const vLat = pPosition.coords.latitude;
                    const vLon = pPosition.coords.longitude;

                    try {
                        const vUrlRev = `https://nominatim.openstreetmap.org/reverse?lat=${vLat}&lon=${vLon}&format=json`;
                        const vResRev = await fetch(vUrlRev);
                        const vDataRev = await vResRev.json();

                        let vNomVille = t('myPosition');
                        if (vDataRev && vDataRev.address) {
                            vNomVille = vDataRev.address.village || vDataRev.address.town || vDataRev.address.city || vDataRev.address.municipality || t('myPosition');
                        }

                        document.getElementById('txtVille').value = vNomVille;
                        vTimezoneVille = Intl.DateTimeFormat().resolvedOptions().timeZone || "America/Toronto";
                        fetchMeteo(vLat, vLon, vTimezoneVille);

                    } catch (vErreur) {
                        vTimezoneVille = Intl.DateTimeFormat().resolvedOptions().timeZone || "America/Toronto";
                        fetchMeteo(vLat, vLon, vTimezoneVille);
                    }
                }, (vErreur) => {
                    alert(t('gpsFailed'));
                    document.getElementById('divMeteo').innerText = t('gpsError');
                });
            } else {
                alert(t('gpsUnavailable'));
            }
        }

        async function rechercherVille(pNomVille) {
            if (!pNomVille.trim()) return;
            try {
                const vUrlGeo = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(pNomVille)}&count=1&language=${vLangue}&format=json`;
                const vResGeo = await fetch(vUrlGeo);
                const vDataGeo = await vResGeo.json();

                if (vDataGeo.results && vDataGeo.results.length > 0) {
                    const vVille = vDataGeo.results[0];
                    vTimezoneVille = vVille.timezone || "America/Toronto";
                    fetchMeteo(vVille.latitude, vVille.longitude, vTimezoneVille);
                } else {
                    document.getElementById('divMeteo').innerText = t('cityNotFound');
                    document.getElementById('divPrevisions').innerHTML = "";
                    document.getElementById('divHeureVille').innerText = "";
                }
            } catch (vErreur) {
                document.getElementById('divMeteo').innerText = t('searchError');
            }
        }

        async function fetchMeteo(pLat, pLon, pTimezone) {
            try {
                const vUrl = `https://api.open-meteo.com/v1/forecast?latitude=${pLat}&longitude=${pLon}&current_weather=true&hourly=temperature_2m,apparent_temperature,precipitation_probability,weathercode&daily=weathercode,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min&timezone=${encodeURIComponent(pTimezone)}`;
                const vResponse = await fetch(vUrl);
                const vData = await vResponse.json();
                
                // Prévisions 12 prochaines heures
                const vHeures = vData.hourly.time;
                const vTemps = vData.hourly.temperature_2m;
                const vApparents = vData.hourly.apparent_temperature;
                const vPops = vData.hourly.precipitation_probability;
                const vCodes = vData.hourly.weathercode;

                const vHeureLocaleVille = new Date().toLocaleTimeString('en-CA', { timeZone: pTimezone, hour12: false, hour: '2-digit' });
                const vJourLocalVille = new Date().toLocaleDateString('en-CA', { timeZone: pTimezone });
                const vPrefixeIso = `${vJourLocalVille}T${vHeureLocaleVille.padStart(2, '0')}`;

                let vIndexDepart = vHeures.findIndex(h => h.startsWith(vPrefixeIso));
                if (vIndexDepart === -1) vIndexDepart = 0;

                // Température actuelle
                const vTempActuelle = Math.round(vData.current_weather.temperature);
                const vApparentActuelle = vApparents && vApparents[vIndexDepart] !== undefined ? Math.round(vApparents[vIndexDepart]) : vTempActuelle;
                const vIconeActuelle = getIconeMeteo(vData.current_weather.weathercode);
                document.getElementById('divMeteo').innerText = `${vIconeActuelle} ${vTempActuelle} °C (${t('feelsLike')}: ${vApparentActuelle} °C)`;

                // Affichage Météo du jour (daily index 0) et du lendemain (daily index 1)
                let vHtmlDaily = "";
                if (vData.daily) {
                    const vDailyMin0 = Math.round(vData.daily.temperature_2m_min[0]);
                    const vDailyMax0 = Math.round(vData.daily.temperature_2m_max[0]);
                    const vDailyAppMin0 = Math.round(vData.daily.apparent_temperature_min[0]);
                    const vDailyAppMax0 = Math.round(vData.daily.apparent_temperature_max[0]);
                    const vDailyIcon0 = getIconeMeteo(vData.daily.weathercode[0]);

                    const vDailyMin1 = Math.round(vData.daily.temperature_2m_min[1]);
                    const vDailyMax1 = Math.round(vData.daily.temperature_2m_max[1]);
                    const vDailyAppMin1 = Math.round(vData.daily.apparent_temperature_min[1]);
                    const vDailyAppMax1 = Math.round(vData.daily.apparent_temperature_max[1]);
                    const vDailyIcon1 = getIconeMeteo(vData.daily.weathercode[1]);

                    vHtmlDaily = `
                        <div><strong>${t('today')} :</strong> ${vDailyIcon0} ${vDailyMin0}°C / ${vDailyMax0}°C (${t('feelsLike')}: ${vDailyAppMin0}°C / ${vDailyAppMax0}°C)</div>
                        <div><strong>${t('tomorrow')} :</strong> ${vDailyIcon1} ${vDailyMin1}°C / ${vDailyMax1}°C (${t('feelsLike')}: ${vDailyAppMin1}°C / ${vDailyAppMax1}°C)</div>
                    `;
                }
                document.getElementById('divDailyMeteo').innerHTML = vHtmlDaily;

                let vHtmlPrev = "";
                for (let i = vIndexDepart; i < vIndexDepart + 12 && i < vHeures.length; i++) {
                    const vHeureAffichage = vHeures[i].substring(11, 13) + "h";
                    const vTempH = Math.round(vTemps[i]);
                    const vPopH = vPops[i] ?? 0;
                    const vIconeH = getIconeMeteo(vCodes[i]);

                    vHtmlPrev += `
                        <div class="forecast-item">
                            <div class="forecast-time">${vHeureAffichage}</div>
                            <div>${vIconeH}</div>
                            <div class="forecast-temp">${vTempH}°C</div>
                            <div class="forecast-pop">💧 ${vPopH}%</div>
                        </div>`;
                }
                document.getElementById('divPrevisions').innerHTML = vHtmlPrev;
                updateHeures();

            } catch (vErreur) {
                document.getElementById('divMeteo').innerText = t('connectionError');
            }
        }

        // Chargement initial pour Napierville
        rechercherVille("Napierville");

        async function fetchDetailsParManche(pGamePk) {
    let vDataMatch = {
        manches: {},
        totaux: {
            away: { hits: {}, points: {}, erreurs: {} },
            home: { hits: {}, points: {}, erreurs: {} }
        }
    };

    try {
        const vUrl = `https://statsapi.mlb.com/api/v1/game/${pGamePk}/playByPlay`;
        const vResponse = await fetch(vUrl);
        const vData = await vResponse.json();

        if (vData.allPlays) {
            vData.allPlays.forEach(pPlay => {
                const vManche = pPlay.about.inning;
                const vCote = pPlay.about.halfInning;
                const vCle = `${vManche}_${vCote}`;
                const vEquipe = vCote === "top" ? "away" : "home";
                const vEquipeAdverse = vCote === "top" ? "home" : "away";

                if (!vDataMatch.manches[vCle]) {
                    vDataMatch.manches[vCle] = { hits: [], points: [] };
                }

                // Coups sûrs
                if (pPlay.result && pPlay.result.eventType && 
                   ['single', 'double', 'triple', 'home_run'].includes(pPlay.result.eventType)) {
                    const vFrappeur = pPlay.matchup.batter.fullName;
                    vDataMatch.manches[vCle].hits.push({ frappeur: vFrappeur, type: pPlay.result.event });
                    vDataMatch.totaux[vEquipe].hits[vFrappeur] = (vDataMatch.totaux[vEquipe].hits[vFrappeur] || 0) + 1;
                }

                // Points produits
                if (pPlay.result && pPlay.result.rbi && pPlay.result.rbi > 0) {
                    const vFrappeur = pPlay.matchup.batter.fullName;
                    vDataMatch.manches[vCle].points.push({ frappeur: vFrappeur, rbi: pPlay.result.rbi });
                    vDataMatch.totaux[vEquipe].points[vFrappeur] = (vDataMatch.totaux[vEquipe].points[vFrappeur] || 0) + pPlay.result.rbi;
                }

                // --- CAPTURE DES ERREURS MULTI-SOURCES ---
                let vNomsErreurs = [];

                // 1. Crédits globaux de la séquence
                if (pPlay.credits) {
                    pPlay.credits.forEach(pCredit => {
                        if (pCredit.credit && pCredit.credit.toLowerCase().includes('error')) {
                            vNomsErreurs.push(pCredit.player ? pCredit.player.fullName : t('collectiveError'));
                        }
                    });
                }

                // 2. Événements de lancer/relais (playEvents)
                if (pPlay.playEvents) {
                    pPlay.playEvents.forEach(pEvt => {
                        if (pEvt.credits) {
                            pEvt.credits.forEach(pCredit => {
                                if (pCredit.credit && pCredit.credit.toLowerCase().includes('error')) {
                                    vNomsErreurs.push(pCredit.player ? pCredit.player.fullName : t('collectiveError'));
                                }
                            });
                        }
                    });
                }

                // 3. Analyse des coureurs (erreurs sur feintes, mauvais relais, etc.)
                if (pPlay.runners) {
                    pPlay.runners.forEach(pRunner => {
                        if (pRunner.details) {
                            if (pRunner.details.isError) {
                                const vNom = pRunner.details.responsibleFielder ? pRunner.details.responsibleFielder.fullName : t('collectiveError');
                                vNomsErreurs.push(vNom);
                            }
                            if (pRunner.details.credits) {
                                pRunner.details.credits.forEach(pCredit => {
                                    if (pCredit.credit && pCredit.credit.toLowerCase().includes('error')) {
                                        vNomsErreurs.push(pCredit.player ? pCredit.player.fullName : t('collectiveError'));
                                    }
                                });
                            }
                        }
                    });
                }

                // 4. Recours au texte de description si l'erreur n'a pas été attribuée à un joueur précis
                if (vNomsErreurs.length === 0 && pPlay.result && pPlay.result.description && pPlay.result.description.toLowerCase().includes('error')) {
                    const vDesc = pPlay.result.description;
                    const vMatch = vDesc.match(/error by ([a-zA-Z\s.-]+?)(?=\.|\,|$|\sallows|\son|\sto)/i);
                    vNomsErreurs.push(vMatch ? vMatch[1].trim() : t('collectiveError'));
                }

                // Enregistrement des erreurs attribuées à l'équipe en défense
                vNomsErreurs.forEach(vJoueur => {
                    vDataMatch.totaux[vEquipeAdverse].erreurs[vJoueur] = (vDataMatch.totaux[vEquipeAdverse].erreurs[vJoueur] || 0) + 1;
                });
            });
        }
    } catch (vErreur) {
        console.error("Erreur chargement détails match", vErreur);
    }
    return vDataMatch;
}

            const vInnings = vLinescore.innings;

                vHtml += `<th>${i}</th>`;

            vHtml += `<th class="stat-col">R</th><th class="stat-col">H</th><th class="stat-col">E</th></tr></thead><tbody>`;

                if (vInfo.points.length > 0) {

                }
                vTexte += `</span>`;
                return vTexte;
            }

function genererTooltipTotal(pEquipe, pType) {
    const vObj = pDetails.totaux[pEquipe][pType];
    const vNoms = Object.keys(vObj);
    
    if (vNoms.length === 0) {
        const vMessageVide = pType === "erreurs" ? t('noErrors') : t('noData');

    let vTitre = pType === "hits" ? t('hits') : (pType === "points" ? t('runsBattedIn') : t('errors'));
    let vTexte = `<span class="tooltip"><strong>${vTitre}:</strong><br>`;
    vNoms.forEach(pNom => { vTexte += `• ${pNom} : ${vObj[pNom]}<br>`; });
    vTexte += `</span>`;
    return vTexte;
}

            // Ligne Visiteurs

            vHtml += `<td class="stat-col">${vLinescore.teams.away.errors ?? 0}${genererTooltipTotal("away", "erreurs")}</td></tr>`;

            // Ligne Domicile
            const vHomeTeam = pMatch.teams.home;
            vHtml += `<tr><td class="team-name">${vHomeTeam.team.name}</td>`;
            for (let i = 0; i < vNbManches; i++) {
                const vRuns = vInnings[i] && vInnings[i].home && vInnings[i].home.runs !== undefined ? vInnings[i].home.runs : "-";

            vHtml += `<td class="stat-col">${vLinescore.teams.home.runs ?? 0}${genererTooltipTotal("home", "points")}</td>`;
            vHtml += `<td class="stat-col">${vLinescore.teams.home.hits ?? 0}${genererTooltipTotal("home", "hits")}</td>`;
            vHtml += `<td class="stat-col">${vLinescore.teams.home.errors ?? 0}${genererTooltipTotal("home", "erreurs")}</td></tr>`;

let vTimerMlb = null;
let vDernierGamePk = null;
let vDernierAwayScore = null;
let vDernierHomeScore = null;

async function fetchBlueJays(pTeamId) {
    if (vTimerMlb) {
        clearInterval(vTimerMlb);
    }

    const vRafraichir = async () => {
        let vMatchEnDirect = null;

        try {
            const vAujourdhui = new Date();
            const vDebut = new Date(vAujourdhui);
            vDebut.setDate(vAujourdhui.getDate() - 10);
            const vFin = new Date(vAujourdhui);
            vFin.setDate(vAujourdhui.getDate() + 10);

            // sv-SE formate en YYYY-MM-DD selon le fuseau horaire local
            const vStrDebut = vDebut.toLocaleDateString('sv-SE');
            const vStrFin = vFin.toLocaleDateString('sv-SE');

            const vUrl = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${pTeamId}&startDate=${vStrDebut}&endDate=${vStrFin}&hydrate=linescore`;
            const vResponse = await fetch(vUrl);
            const vData = await vResponse.json();

            if (vData.dates && vData.dates.length > 0) {
                let vTousLesMatchs = [];
                vData.dates.forEach(pDate => {
                    pDate.games.forEach(pJeu => vTousLesMatchs.push(pJeu));
                });

                vMatchEnDirect = vTousLesMatchs.find(pJeu => pJeu.status.abstractGameState === "Live");
                const vMatchsTermines = vTousLesMatchs.filter(pJeu => pJeu.status.abstractGameState === "Final");
                const vProchainsMatchs = vTousLesMatchs.filter(pJeu => pJeu.status.abstractGameState === "Preview");

                // Détecter un changement de score pour la vibration
                const vGameAffiche = vMatchEnDirect || (vMatchsTermines.length > 0 ? vMatchsTermines[vMatchsTermines.length - 1] : null);
                if (vGameAffiche) {
                    const vGamePk = vGameAffiche.gamePk;
                    const vAwayScore = vGameAffiche.teams.away.score ?? 0;
                    const vHomeScore = vGameAffiche.teams.home.score ?? 0;

                    if (vDernierGamePk === vGamePk) {
                        if (vDernierAwayScore !== null && vDernierHomeScore !== null && (vDernierAwayScore !== vAwayScore || vDernierHomeScore !== vHomeScore)) {
                            if (navigator.vibrate) {
                                navigator.vibrate([200, 100, 200]);
                            }
                        }
                    }
                    vDernierGamePk = vGamePk;
                    vDernierAwayScore = vAwayScore;
                    vDernierHomeScore = vHomeScore;
                } else {
                    vDernierGamePk = null;
                    vDernierAwayScore = null;
                    vDernierHomeScore = null;
                }

                let vHtml = "";

                // Match en direct
                if (vMatchEnDirect) {
                    const vDetailsDirect = await fetchDetailsParManche(vMatchEnDirect.gamePk);
                    vHtml += `<div style="color: #ff4444; font-weight: bold; margin-bottom: 5px;">🔴 ${t('live')}</div>`;
                    if (vMatchEnDirect.linescore && vMatchEnDirect.linescore.currentInning) {
                        const vEtatManche = vMatchEnDirect.linescore.inningState || (vMatchEnDirect.linescore.isTopInning ? (vLangue === 'en' ? "Top" : "Haut") : (vLangue === 'en' ? "Bottom" : "Bas")) || "";
                        vHtml += `<small style="color: #aaa;">${t('inning')} : ${vEtatManche} ${vMatchEnDirect.linescore.currentInning}</small>`;
                    }
                    vHtml += construireTableauIndicateur(vMatchEnDirect, vDetailsDirect);
                }

                // Dernier match terminé
                if (vMatchsTermines.length > 0) {
                    const vDernier = vMatchsTermines[vMatchsTermines.length - 1];
                    const vDetailsDernier = await fetchDetailsParManche(vDernier.gamePk);
                    vHtml += `<div style="font-size: 0.9rem; color: #888;">${t('lastGame')}</div>`;
                    vHtml += construireTableauIndicateur(vDernier, vDetailsDernier);
                }

                // Prochain match
                if (vProchainsMatchs.length > 0) {
                    const vProchain = vProchainsMatchs[0];
                    const vDateHeure = new Date(vProchain.gameDate);
                    const vHeureLocale = vDateHeure.toLocaleTimeString(vLocale(), { hour: '2-digit', minute: '2-digit' });
                    const vJourLocal = vDateHeure.toLocaleDateString(vLocale(), { weekday: 'short', day: 'numeric', month: 'short' });

                    vHtml += `<div style="font-size: 0.9rem; color: #888; margin-top: 10px;">${t('nextGame')}</div>`;
                    vHtml += `<div style="font-weight: bold; margin-top: 3px;">${vProchain.teams.away.team.name} @ ${vProchain.teams.home.team.name}</div>`;
                    vHtml += `<small style="color: var(--title-color);">${vJourLocal} à ${vHeureLocale}</small>`;
                }

                const vHeureMaj = new Date().toLocaleTimeString(vLocale());
                vHtml += `<div style="font-size: 0.75rem; color: #777; margin-top: 10px; text-align: right;">${t('lastUpdate')} ${vHeureMaj}</div>`;
                document.getElementById('divJays').innerHTML = vHtml || t('noGame');
            } else {
                document.getElementById('divJays').innerText = t('noRecentGames');
            }

            // Ajustement dynamique du délai : 30s en direct, 5 min sinon
            const vDelai = vMatchEnDirect ? 30000 : 300000;
            if (vTimerMlb) clearInterval(vTimerMlb);
            vTimerMlb = setInterval(vRafraichir, vDelai);

        } catch (vErreur) {
            console.error("Erreur MLB:", vErreur);
            document.getElementById('divJays').innerText = t('mlbError');
            if (vTimerMlb) clearInterval(vTimerMlb);
            vTimerMlb = setInterval(vRafraichir, 60000); // 1 min en cas d'erreur réseau
        }
    };

    await vRafraichir();
}

const vApiKey = 'eee5e318da824cb0a4bee394e6cf3a39';
let vPageJeux = 1;

async function chargerSortiesMoisAuto(pApiKey, pAnnee = null, pMois = null, pPage = 1) {
    const vContainer = document.getElementById('divMonthlyGames');

    if (!pApiKey || pApiKey === 'VOTRE_CLE_API') {
        vContainer.innerText = t('missingApiKey');
        return;
    }

    vPageJeux = pPage;

    const vMaintenant = new Date();
    const vAnnee = pAnnee || vMaintenant.getFullYear();
    const vMois = pMois ? String(pMois).padStart(2, '0') : String(vMaintenant.getMonth() + 1).padStart(2, '0');

    // Calcul du dernier jour du mois sélectionné
    const vDernierJour = new Date(vAnnee, parseInt(vMois, 10), 0).getDate();

    const vDateDebut = `${vAnnee}-${vMois}-01`;
    const vDateFin = `${vAnnee}-${vMois}-${vDernierJour}`;

    const vUrl = `https://api.rawg.io/api/games?key=${pApiKey}&dates=${vDateDebut},${vDateFin}&ordering=released&page_size=5&page=${pPage}`;

    vContainer.innerText = t('loadingReleases');

    try {
        const vResponse = await fetch(vUrl);
        if (!vResponse.ok) {
            throw new Error(`Erreur HTTP ${vResponse.status}`);
        }

        const vData = await vResponse.json();

        if (!vData.results || vData.results.length === 0) {
            vContainer.innerText = t('noReleases');
            return;
        }

        let vHtml = '<ul style="padding-left: 15px; margin: 0;">';

        vData.results.forEach(pJeu => {
            const vDateSortie = pJeu.released || t('unknownDate');
            const vPlateformes = pJeu.platforms 
                ? pJeu.platforms.map(pP => pP.platform.name).join(', ') 
                : 'N/A';
            const vGameUrl = pJeu.slug ? `https://rawg.io/games/${pJeu.slug}` : '#';

            vHtml += `<li style="margin-bottom: 8px;">
                <strong><a href="${vGameUrl}" target="_blank" style="color: inherit; text-decoration: underline;">${pJeu.name}</a></strong> 
                <span style="font-size: 0.85rem; opacity: 0.8;">(${vPlateformes})</span>
                <br>
                <small style="color: var(--title-color);">${t('release')} ${vDateSortie}</small>
            </li>`;
        });

        vHtml += '</ul>';

        // Ajout des boutons de pagination
        const vHasPrev = vData.previous !== null;
        const vHasNext = vData.next !== null;

        vHtml += `
        <div class="pagination-container">
            <button class="btn-pagination" id="btnPagePrev" ${vHasPrev ? '' : 'disabled'} onclick="changerPageJeux(-1)">
                ${t('prevPage')}
            </button>
            <span style="font-size: 0.85rem; font-weight: bold;">Page ${pPage}</span>
            <button class="btn-pagination" id="btnPageNext" ${vHasNext ? '' : 'disabled'} onclick="changerPageJeux(1)">
                ${t('nextPage')}
            </button>
        </div>`;

        vContainer.innerHTML = vHtml;
    } catch (vErreur) {
        vContainer.innerText = `${t('releasesError')} (${vErreur.message}).`;
        console.error(vErreur);
    }
}

function changerPageJeux(pDirection) {
    const vInputMois = document.getElementById('inputMois');
    if (vInputMois && vInputMois.value) {
        const [vAnnee, vMois] = vInputMois.value.split('-');
        chargerSortiesMoisAuto(vApiKey, vAnnee, vMois, vPageJeux + pDirection);
    }
}

// Initialisation automatique
document.addEventListener('DOMContentLoaded', () => {
    const vInputMois = document.getElementById('inputMois');
    const vMaintenant = new Date();
    
    const vAnneeCourante = vMaintenant.getFullYear();
    const vMoisCourant = String(vMaintenant.getMonth() + 1).padStart(2, '0');
    
    if (vInputMois) {
        // Définir la valeur initiale sur le mois courant (AAAA-MM)
        vInputMois.value = `${vAnneeCourante}-${vMoisCourant}`;

        // Recharger lors d'un changement de valeur
        vInputMois.addEventListener('change', (pEvent) => {
            if (pEvent.target.value) {
                const [vAnnee, vMois] = pEvent.target.value.split('-');
                chargerSortiesMoisAuto(vApiKey, vAnnee, vMois, 1);
            }
        });
    }

    // Premier appel avec le mois courant
    chargerSortiesMoisAuto(vApiKey, vAnneeCourante, vMoisCourant, 1);
});
